name: 文档站生产构建自检

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 生产构建链路自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@22
          cache: true
          install: false
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 记录构建前内存
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          node -e "const v8=require('node:v8'); console.log('V8 heap limit MiB:', Math.round(v8.getHeapStatistics().heap_size_limit / 1024 / 1024))"
          free -h
      - name: 生产构建
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v pnpm run build
          else
            pnpm run build
          fi
      - name: 验证 Nuxt 产物可启动
        run: |
          set -u
          test -f packages/ai-vue-doc/.output/server/index.mjs
          cd packages/ai-vue-doc

          server_log=/tmp/ai-vue-doc-server.log
          response_headers=/tmp/ai-vue-doc-headers.txt
          response_body=/tmp/ai-vue-doc-home.html

          : > "$server_log"
          : > "$response_headers"
          : > "$response_body"

          NITRO_PORT=3010 NITRO_HOST=127.0.0.1 PORT=3010 HOST=127.0.0.1 \
            node .output/server/index.mjs > "$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          print_diagnostics() {
            echo "===== Nuxt server process ====="
            ps -p "$server_pid" -o pid=,ppid=,stat=,etime=,cmd= || true
            echo "===== Nuxt server log ====="
            cat "$server_log" || true
            echo "===== HTTP response headers ====="
            cat "$response_headers" || true
            echo "===== HTTP response body (first 120 lines) ====="
            sed -n '1,120p' "$response_body" || true
          }

          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              set +e
              wait "$server_pid"
              server_status=$?
              set -e
              echo "Nuxt output server exited before becoming ready; exit=${server_status}."
              print_diagnostics
              exit 1
            fi

            http_status=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 2 \
              --max-time 10 \
              --output "$response_body" \
              --dump-header "$response_headers" \
              --write-out '%{http_code}' \
              http://127.0.0.1:3010/ || true)

            case "$http_status" in
              2*|3*)
                echo "Nuxt output smoke test passed on attempt ${attempt}; HTTP ${http_status}."
                exit 0
                ;;
              000|"")
                echo "Nuxt output is not accepting HTTP yet (attempt ${attempt}/30)."
                ;;
              *)
                echo "Nuxt output responded with HTTP ${http_status}; treating this as a runtime failure."
                print_diagnostics
                exit 1
                ;;
            esac

            sleep 1
          done

          echo "Nuxt output server did not become HTTP-ready in time."
          print_diagnostics
          exit 1
      - name: 上传 Nuxt 启动诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-runtime-smoke-diagnostics
          path: |
            /tmp/ai-vue-doc-server.log
            /tmp/ai-vue-doc-headers.txt
            /tmp/ai-vue-doc-home.html
          if-no-files-found: warn
          retention-days: 1
